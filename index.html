async function scan(i){if(!i.files[0])return;IMG=await img(i.files[0]);toast('Membaca struk…');
 try{const t=(await api({a:'ocr',img:IMG})).text,m=t.match(/total[^\d\n]{0,20}([\d.,]{4,})/i),ns=(t.match(/\d{1,3}(?:[.,]\d{3})+|\d{4,}/g)||[]).map(v=>+v.replace(/[.,]/g,'')),nom=m?+m[1].replace(/[.,]\d{2}$/,'').replace(/[.,]/g,''):Math.max(0,...ns);
 if(nom)$('#f_n').value=nom;const d=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(d){const y=d[3].length==2?'20'+d[3]:d[3];$('#f_t').value=`${y}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`}toast('Struk terbaca, periksa kembali ✓')}catch(e){toast('OCR gagal, isi manual',false)}}

function berForm(id){const b=S.ber.find(x=>x.id==id)||{jenis:'Pengeluaran',hari:1},o=(a,v)=>a.map(i=>`<option ${i==v?'selected':''}>${i}</option>`).join('');openM(`<h2>${id?'Edit':'Atur'} Transaksi Berulang</h2><label class="l">Jenis</label><select id="b_j" onchange="$('#b_k').innerHTML=kat(this.value).map(i=>'<option>'+i+'</option>').join('')">${o(Object.keys(KAT),b.jenis)}</select><label class="l">Kategori</label><select id="b_k">${o([...new Set([...kat(b.jenis),b.kategori].filter(Boolean))],b.kategori)}</select><label class="l">Nominal (Rp)</label><input id="b_n" type="number" step="any" inputmode="numeric" value="${b.nominal||''}"><label class="l">Rekening / Wallet</label><select id="b_r"><option value="">-</option>${o(S.rek.map(r=>r.nama),b.rekening)}</select><label class="l">Tanggal tiap bulan (1–28)</label><input id="b_h" type="number" min="1" max="28" value="${b.hari}"><label class="l">Catatan</label><input id="b_c" value="${b.catatan||''}"><button class="b" onclick="berSave('${id||''}')">Simpan</button>${id?`<button class="b b3" style="margin-top:8px" onclick="hapus('Berulang','${id}')">Hapus</button>`:''}`)}
async function berSave(id){const o=S.ber.find(x=>x.id==id)||{},r={id,jenis:$('#b_j').value,kategori:$('#b_k').value,nominal:+$('#b_n').value,rekening:$('#b_r').value,catatan:$('#b_c').value,hari:+$('#b_h').value,terakhir:o.terakhir||''};if(!(r.nominal>0)||!(r.hari>=1&&r.hari<=28))return toast('Nominal harus > 0 dan tanggal 1–28',false);try{await api({a:'save',tab:'Berulang',row:r});toast('Tersimpan ✓ Transaksi dibuat otomatis saat jatuh tempo');closeM();load()}catch(e){toast('Gagal: '+e.message,false)}}
const EF={Pengeluaran:'Mengurangi saldo kas','Penerimaan Utang':'Menambah saldo kas & total utang','Cicilan Utang':'Mengurangi saldo kas & total utang','Pemberian Piutang':'Mengurangi saldo kas & menambah total piutang','Penerimaan Piutang':'Menambah saldo kas & mengurangi total piutang','Pembelian Aset':'Mengurangi saldo kas & menambah nilai aset (komposisi aset berubah)','Penjualan Aset':'Menambah saldo kas & mengurangi nilai aset (komposisi aset berubah)'};
function asetFld(){const j=$('#f_j').value,k=$('#f_k').value,e=$('#f_a');$('#f_h').textContent=(j=='Pendapatan'?'Menambah saldo kas & pendapatan':j=='Pengeluaran'?EF.Pengeluaran:EF[k]||'');
 if(j!='Aset'){e.innerHTML='';return}
 e.innerHTML=`<label class="l">Aset terkait</label><select id="f_as" onchange="$('#f_ab').style.display=this.value=='__baru'?'block':'none'">${S.aset.map(a=>`<option value="${a.id}" ${a.id==X.asetId?'selected':''}>${a.nama} (${a.jenis})</option>`).join('')}<option value="__baru">+ Aset baru…</option></select><div id="f_ab" style="display:${S.aset.length?'none':'block'}"><input id="f_an" placeholder="Nama aset baru"><select id="f_aj">${lst('Aset').map(k=>`<option>${k}</option>`).join('')}</select></div>`}
function komp(t){const c={};S.aset.forEach(x=>c[x.jenis]=(c[x.jenis]||0)+ +x.nilai);return`<h3>Komposisi Aset</h3><div class="c">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:8px"><div class="r" style="padding:0;border:0"><span>${k}</span><b>${t?Math.round(v/t*100):0}% · ${rp(v)}</b></div><div class="hb"><i style="width:${t?v/t*100:0}%"></i></div></div>`).join('')||'<p class="l">Belum ada aset.</p>'}</div>`}
boot();
</script></body></html>
